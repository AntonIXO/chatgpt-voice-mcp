[package]
name = "chatgpt-voice-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chatgpt-voice-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
libc = "0.2"
rmcp = { version = "1.5.0", features = ["transport-io"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["macros", "rt", "sync"] }
